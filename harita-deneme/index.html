<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Türkiye Seçim Haritası</title>
    <!-- Tasarım dosyamızı bağlıyoruz -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h2>Türkiye Seçim Bölgeleri Haritası</h2>
    
    <!-- YENİ EKLENEN KISIM: Kontrol Paneli -->
    <div class="kontroller">
        <div class="kontrol-grubu">
            <label for="renk-secici">Parlama Rengi:</label>
            <input type="color" id="renk-secici" value="#ff4757">
        </div>
        <div class="kontrol-grubu">
            <label for="kalinlik-secici">Sınır Kalınlığı: <span id="kalinlik-deger">0.8px</span></label>
            <input type="range" id="kalinlik-secici" min="0.1" max="3" step="0.1" value="0.8">
        </div>
    </div>

    <div id="bolge-ismi">Harita yükleniyor...</div>

    <!-- Harita buraya JavaScript tarafından dinamik olarak yüklenecek -->
    <div id="harita-alani"></div>

    <!-- İşlev dosyamızı bağlıyoruz -->
    <script src="script.js"></script>
</body>
</html>
